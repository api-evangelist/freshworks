openapi: 3.2.0
info:
  title: Freshworks Freshservice Service Catalog API
  description: The Freshservice API v2 is a RESTful API for managing IT service desk operations programmatically. It provides endpoints for tickets, problems, changes, releases, assets, requesters, agents, and other ITSM resources. The API supports Cross-Origin Resource Sharing (CORS) for web-based applications, uses API key authentication via Base64-encoded authorization headers, and allows organizations to automate IT service management workflows and integrate Freshservice with other enterprise tools.
  version: '2.0'
  contact:
    name: Freshworks Support
    url: https://support.freshservice.com/
  termsOfService: https://www.freshworks.com/terms/
servers:
- url: https://{domain}.freshservice.com/api/v2
  description: Freshservice Production Server
  variables:
    domain:
      default: yourdomain
      description: Your Freshservice subdomain
security:
- basicAuth: []
tags:
- name: Service Catalog
  description: Manage service catalog items available for request.
paths:
  /service_catalog/items:
    get:
      operationId: listServiceCatalogItems
      summary: List all service catalog items
      description: Retrieves a list of all items available in the service catalog for requesters to browse and request.
      tags:
      - Service Catalog
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  service_items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /service_catalog/items/{item_id}:
    get:
      operationId: getServiceCatalogItem
      summary: View a service catalog item
      description: Retrieves the details of a specific service catalog item.
      tags:
      - Service Catalog
      parameters:
      - name: item_id
        in: path
        required: true
        description: The ID of the service catalog item.
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  service_item:
                    $ref: '#/components/schemas/ServiceItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Error:
      type: object
      properties:
        description:
          type: string
          description: Human-readable error message.
        errors:
          type: array
          description: List of specific validation errors.
          items:
            type: object
            properties:
              field:
                type: string
                description: Field that caused the error.
              message:
                type: string
                description: Error message.
              code:
                type: string
                description: Error code.
    ServiceItem:
      type: object
      properties:
        id:
          type: integer
          description: Unique ID of the service item.
        name:
          type: string
          description: Name of the service item.
        description:
          type: string
          description: Description.
        short_description:
          type: string
          description: Short description for catalog listing.
        category_id:
          type: integer
          description: ID of the service category.
        display_id:
          type: integer
          description: Display ID for the item.
        delivery_time:
          type: integer
          description: Expected delivery time in hours.
        visibility:
          type: integer
          description: Visibility setting.
        created_at:
          type: string
          format: date-time
          description: Timestamp when created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when last updated.
  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: per_page
      in: query
      description: Number of results per page (max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use your API key as the username and X as the password. The API key can be found in your Freshservice profile settings.
externalDocs:
  description: Freshservice API Documentation
  url: https://api.freshservice.com/
