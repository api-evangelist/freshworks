openapi: 3.2.0
info:
  title: Freshworks Products API
  version: '2.0'
  termsOfService: https://www.freshworks.com/terms/
  description: 'Operations tagged Products across 2 of this provider''s published API definitions: freshworks-freshdesk-api-openapi.yml, freshworks-freshservice-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{domain}.freshdesk.com/api/v2
  description: Freshdesk Production Server
  variables:
    domain:
      default: yourdomain
      description: Your Freshdesk subdomain
- url: https://{domain}.freshservice.com/api/v2
  description: Freshservice Production Server
  variables:
    domain:
      default: yourdomain
      description: Your Freshservice subdomain
security:
- basicAuth: []
tags:
- name: Products
  description: Manage products associated with the helpdesk.
paths:
  /products:
    get:
      operationId: listProducts
      summary: List all products
      description: Retrieves a list of all products configured in the helpdesk.
      tags:
      - Products
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://{domain}.freshdesk.com/api/v2
      description: Freshdesk Production Server
      variables:
        domain:
          default: yourdomain
          description: Your Freshdesk subdomain
  /products/{product_id}:
    get:
      operationId: getProduct
      summary: View a product
      description: Retrieves the details of a specific product by its ID.
      tags:
      - Products
      parameters:
      - name: product_id
        in: path
        required: true
        description: The ID of the product to retrieve.
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://{domain}.freshdesk.com/api/v2
      description: Freshdesk Production Server
      variables:
        domain:
          default: yourdomain
          description: Your Freshdesk subdomain
components:
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        description:
          type: string
          description: Human-readable error message.
        errors:
          type: array
          description: List of specific validation errors.
          items:
            type: object
            properties:
              field:
                type: string
                description: Field that caused the error.
              message:
                type: string
                description: Error message for the field.
              code:
                type: string
                description: Error code.
    Product:
      type: object
      properties:
        id:
          type: integer
          description: Unique ID of the product.
        name:
          type: string
          description: Name of the product.
        description:
          type: string
          description: Description of the product.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the product was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the product was last updated.
    Error_2:
      type: object
      properties:
        description:
          type: string
          description: Human-readable error message.
        errors:
          type: array
          description: List of specific validation errors.
          items:
            type: object
            properties:
              field:
                type: string
                description: Field that caused the error.
              message:
                type: string
                description: Error message.
              code:
                type: string
                description: Error code.
    Product_2:
      type: object
      properties:
        id:
          type: integer
          description: Unique ID of the product.
        name:
          type: string
          description: Name of the product.
        description:
          type: string
          description: Description.
        asset_type_id:
          type: integer
          description: ID of the associated asset type.
        manufacturer:
          type: string
          description: Manufacturer name.
        mode_of_procurement:
          type: string
          description: Procurement mode.
        status:
          type: string
          description: Product status.
        created_at:
          type: string
          format: date-time
          description: Timestamp when created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when last updated.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use your API key as the username and X as the password. The API key can be found in your Freshdesk profile settings.
x-refined-from:
- freshworks-freshdesk-api-openapi.yml
- freshworks-freshservice-api-openapi.yml
