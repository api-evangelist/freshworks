openapi: 3.2.0
info:
  title: Freshworks Freshdesk Surveys API
  description: The Freshdesk API v2 is a RESTful API that provides programmatic access to Freshdesk helpdesk functionality. It allows developers to manage tickets, contacts, companies, agents, groups, and other helpdesk resources through standard CRUD operations. The API uses JSON for data exchange, supports API key authentication, and enables integration of Freshdesk customer support workflows into third-party applications and automation pipelines.
  version: '2.0'
  contact:
    name: Freshworks Support
    url: https://support.freshdesk.com/
  termsOfService: https://www.freshworks.com/terms/
servers:
- url: https://{domain}.freshdesk.com/api/v2
  description: Freshdesk Production Server
  variables:
    domain:
      default: yourdomain
      description: Your Freshdesk subdomain
security:
- basicAuth: []
tags:
- name: Surveys
  description: Manage customer satisfaction surveys.
paths:
  /surveys/satisfaction_ratings:
    get:
      operationId: listSatisfactionRatings
      summary: List all satisfaction ratings
      description: Retrieves a list of all customer satisfaction ratings received for helpdesk tickets.
      tags:
      - Surveys
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      - name: created_since
        in: query
        description: Filter ratings created since this timestamp.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SatisfactionRating'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    Error:
      type: object
      properties:
        description:
          type: string
          description: Human-readable error message.
        errors:
          type: array
          description: List of specific validation errors.
          items:
            type: object
            properties:
              field:
                type: string
                description: Field that caused the error.
              message:
                type: string
                description: Error message for the field.
              code:
                type: string
                description: Error code.
    SatisfactionRating:
      type: object
      properties:
        id:
          type: integer
          description: Unique ID of the satisfaction rating.
        survey_id:
          type: integer
          description: ID of the associated survey.
        user_id:
          type: integer
          description: ID of the user who provided the rating.
        agent_id:
          type: integer
          description: ID of the agent who handled the ticket.
        ticket_id:
          type: integer
          description: ID of the ticket that was rated.
        rating:
          type: integer
          description: Satisfaction rating value.
        feedback:
          type: string
          description: Feedback text from the customer.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the rating was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the rating was last updated.
  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: per_page
      in: query
      description: Number of results per page (max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use your API key as the username and X as the password. The API key can be found in your Freshdesk profile settings.
externalDocs:
  description: Freshdesk API Documentation
  url: https://developers.freshdesk.com/api/
